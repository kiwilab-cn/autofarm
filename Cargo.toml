[workspace]
resolver = "3"
members = [
    "src/sim",
    "src/ai",
    "src/editor",
    "src/app",
]
default-members = ["src/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["AUTOFARM Contributors"]
license = "MIT"
rust-version = "1.95"
repository = "https://github.com/kiwilab-cn/autofarm"

[workspace.dependencies]
anyhow = "1.0.99"
autofarm-ai = { path = "src/ai" }
autofarm-editor = { path = "src/editor" }
autofarm-sim = { path = "src/sim" }
bevy = "0.19.1"
ron = "0.11.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
